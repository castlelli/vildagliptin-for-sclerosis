[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssc-figures"
version = "1.0.0"
description = "Figures for the vildagliptin / systemic sclerosis repositioning study, rendered from frozen DaVinci results."
readme = "README.md"
requires-python = ">=3.10"
# Ranges for plotly/kaleido are the ones the original notebook installed;
# the rest were not recorded in Colab and are left unpinned.
dependencies = [
  "plotly>=6.1.1,<7",
  "kaleido>=1.0.0,<2",
  "pandas",
  "numpy",
  "matplotlib",
  "Pillow",
  "ipython",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ssc-figures = "ssc_figures.__main__:main"

[tool.setuptools.packages.find]
include = ["ssc_figures*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# The Colab export put one argument per line with trailing commas;
# collapse those so the code reads at normal density.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# `d` and `a` come from a cell missing from the export; see the NOTE there.
"ssc_figures/figures/fig06_scrna_replication.py" = ["F821"]
